# Seata Server 注册/配置中心地址（Docker 版，Nacos 用容器名）
registry {
  type = "nacos"

  nacos {
    application = "seata-server"
    serverAddr = "nacos:8848"
    group = "SEATA_GROUP"
    namespace = ""
    cluster = "default"
    username = ""
    password = ""
  }
}

config {
  type = "nacos"

  nacos {
    serverAddr = "nacos:8848"
    namespace = ""
    group = "SEATA_GROUP"
    dataId = "seataServer.properties"
    username = ""
    password = ""
  }
}
